<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Tablet</title>
    <link rel="stylesheet" href="css/tablet.css">
</head>
<body>
    <div id="overlay" class="overlay hidden">
        <div class="tablet" role="application" aria-label="Gambling tablet">
            <header class="chrome">
                <nav id="nav" class="nav" aria-label="Games"></nav>
                <div class="profile">
                    <div class="profile-copy">
                        <strong id="playerName">Player</strong>
                        <span id="playerRole">Player</span>
                    </div>
                    <div class="avatar" aria-hidden="true">
                        <svg viewBox="0 0 40 40">
                            <circle cx="20" cy="20" r="18" fill="#16161a" stroke="#e11d2e" stroke-width="2"/>
                            <circle cx="20" cy="16" r="6" fill="#fff"/>
                            <path d="M8 32c3-7 21-7 24 0" fill="#fff"/>
                        </svg>
                    </div>
                </div>
            </header>

            <section class="stats" aria-label="Session stats">
                <article class="stat">
                    <span>Current Balance:</span>
                    <div class="stat-row">
                        <strong id="statBalance">$0</strong>
                        <em id="statBalanceChip" class="chip">LIVE</em>
                    </div>
                </article>
                <article class="stat">
                    <span>Recent Win:</span>
                    <div class="stat-row">
                        <strong id="statWin">$0</strong>
                        <em id="statWinChip" class="chip">+0</em>
                    </div>
                </article>
                <article class="stat">
                    <span>Total Wagered:</span>
                    <div class="stat-row">
                        <strong id="statWagered">$0</strong>
                        <em id="statWageredChip" class="chip">SESSION</em>
                    </div>
                </article>
            </section>

            <main id="view" class="view"></main>

            <footer class="dock">
                <p id="statusLine">House edge and payouts are live from the server config.</p>
                <button id="closeBtn" class="key" type="button">RSHIFT</button>
            </footer>
        </div>
    </div>
    <div id="toast" class="toast" hidden></div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
