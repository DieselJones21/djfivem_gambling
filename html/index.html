<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The 305</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23050308'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23ff2d95'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/tablet.css">
</head>
<body>
    <div id="overlay" class="overlay hidden">
        <div class="tablet" role="application" aria-label="The 305 gambling tablet">
            <header class="chrome">
                <div class="brand">
                    <img class="logo" src="img/the-305.png" alt="The 305">
                </div>
                <nav id="nav" class="nav" aria-label="Games"></nav>
                <div class="profile">
                    <div class="profile-copy">
                        <strong id="playerName">Player</strong>
                        <span id="playerRole">Player</span>
                    </div>
                    <div class="avatar" id="playerAvatar" aria-hidden="true">3</div>
                </div>
            </header>

            <section class="stats" aria-label="Session stats">
                <article class="stat">
                    <span>Current Balance:</span>
                    <div class="stat-row">
                        <strong id="statBalance">$0</strong>
                        <em id="statBalanceChip" class="chip">LIVE</em>
                    </div>
                </article>
                <article class="stat">
                    <span>Recent Win:</span>
                    <div class="stat-row">
                        <strong id="statWin">$0</strong>
                        <em id="statWinChip" class="chip">+0</em>
                    </div>
                </article>
                <article class="stat">
                    <span>Total Wagered:</span>
                    <div class="stat-row">
                        <strong id="statWagered">$0</strong>
                        <em id="statWageredChip" class="chip">SESSION</em>
                    </div>
                </article>
            </section>

            <main id="view" class="view"></main>

            <footer class="dock">
                <p id="statusLine">The 305</p>
                <button id="closeBtn" class="key" type="button">RSHIFT (Close)</button>
            </footer>
        </div>
    </div>
    <div id="toast" class="toast" hidden></div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
