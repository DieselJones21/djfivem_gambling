<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City of Dreams</title>
    <style>html,body{background:transparent!important;background-color:transparent!important;}</style>
    <link rel="icon" href="img/logo-mark.png">
    <link rel="stylesheet" href="css/tablet.css">
</head>
<body>
    <div id="overlay" class="overlay hidden">
        <div class="tablet" role="application" aria-label="City of Dreams gambling tablet">
            <div class="orb orb-a"></div>
            <div class="orb orb-b"></div>
            <div class="orb orb-c"></div>
            <header class="chrome">
                <div class="brand">
                    <img class="logo" src="img/logo.png" alt="City of Dreams" width="72" height="72" decoding="async" draggable="false">
                    <div class="wordmark">
                        <strong>CITY OF</strong>
                        <em>DREAMS</em>
                        <div class="swatches" aria-hidden="true" title="Magenta, cyan, violet, chrome">
                            <i class="magenta"></i>
                            <i class="cyan"></i>
                            <i class="violet"></i>
                            <i class="chrome-dot"></i>
                        </div>
                    </div>
                </div>
                <nav id="nav" class="nav" aria-label="Games"></nav>
                <div class="profile">
                    <div class="profile-copy">
                        <strong id="playerName">Player</strong>
                        <span id="playerRole">House guest</span>
                    </div>
                    <div class="avatar" id="playerAvatar" aria-hidden="true">CD</div>
                </div>
            </header>

            <section class="stats" aria-label="Session stats">
                <article class="stat">
                    <span>Chip Balance:</span>
                    <div class="stat-row">
                        <strong id="statBalance">$0</strong>
                        <em id="statBalanceChip" class="chip">CHIPS</em>
                    </div>
                </article>
                <article class="stat">
                    <span>Recent Win:</span>
                    <div class="stat-row">
                        <strong id="statWin">$0</strong>
                        <em id="statWinChip" class="chip">+0</em>
                    </div>
                </article>
                <article class="stat">
                    <span>Total Wagered:</span>
                    <div class="stat-row">
                        <strong id="statWagered">$0</strong>
                        <em id="statWageredChip" class="chip">SESSION</em>
                    </div>
                </article>
            </section>

            <main id="view" class="view"></main>

            <footer class="dock">
                <span class="footer-brand">
                    <img src="img/logo-mark.png" alt="" width="28" height="28" decoding="async" draggable="false">
                    <span id="statusLine">CITY OF DREAMS</span>
                </span>
                <button id="closeBtn" class="key" type="button">RSHIFT (Close)</button>
            </footer>
        </div>
    </div>
    <div id="toast" class="toast" hidden></div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
