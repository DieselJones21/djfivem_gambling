<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envy Roleplay</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23030806'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='18' font-family='Segoe UI,sans-serif' font-weight='800' fill='%2332a070'%3EE%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/tablet.css">
</head>
<body>
    <div id="overlay" class="overlay hidden">
        <div class="tablet" role="application" aria-label="Envy Roleplay gambling tablet">
            <header class="chrome">
                <div class="brand">
                    <img class="logo" src="img/envy-mark.png" alt="Envy Roleplay">
                    <div class="wordmark">
                        <strong>ENVY</strong>
                        <em>ROLEPLAY</em>
                        <div class="swatches" aria-hidden="true" title="Envy neon, emerald, mint, chrome">
                            <i class="neon"></i>
                            <i class="emerald"></i>
                            <i class="mint"></i>
                            <i class="chrome-dot"></i>
                        </div>
                    </div>
                </div>
                <nav id="nav" class="nav" aria-label="Games"></nav>
                <div class="profile">
                    <div class="profile-copy">
                        <strong id="playerName">Player</strong>
                        <span id="playerRole">Player</span>
                    </div>
                    <div class="avatar" id="playerAvatar" aria-hidden="true">E</div>
                </div>
            </header>

            <section class="stats" aria-label="Session stats">
                <article class="stat">
                    <span>Current Balance:</span>
                    <div class="stat-row">
                        <strong id="statBalance">$0</strong>
                        <em id="statBalanceChip" class="chip">LIVE</em>
                    </div>
                </article>
                <article class="stat">
                    <span>Recent Win:</span>
                    <div class="stat-row">
                        <strong id="statWin">$0</strong>
                        <em id="statWinChip" class="chip">+0</em>
                    </div>
                </article>
                <article class="stat">
                    <span>Total Wagered:</span>
                    <div class="stat-row">
                        <strong id="statWagered">$0</strong>
                        <em id="statWageredChip" class="chip">SESSION</em>
                    </div>
                </article>
            </section>

            <main id="view" class="view"></main>

            <footer class="dock">
                <p id="statusLine">Envy Roleplay</p>
                <button id="closeBtn" class="key" type="button">RSHIFT (Close)</button>
            </footer>
        </div>
    </div>
    <div id="toast" class="toast" hidden></div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
